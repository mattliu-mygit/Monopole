[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weave-agent-signals"
version = "0.1.0"
description = "Layered evaluation & weak RSI for Weave agent traces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
]
judge = [
    "openai>=1.40",
]
rsi = [
    "gepa>=0.1",
]

[project.scripts]
weave-agent-signals = "weave_agent_signals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_agent_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
