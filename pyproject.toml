[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weave-agent-signals"
version = "0.1.0"
description = "Layered evaluation & weak RSI for Weave agent traces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.15",
]
judge = [
    "openai>=1.40",
]
rsi = [
    "gepa>=0.1",
]

[project.scripts]
weave-agent-signals = "weave_agent_signals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_agent_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/weave_agent_signals/judges/rubrics.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
