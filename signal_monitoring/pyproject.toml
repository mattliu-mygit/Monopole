[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weave-signal-monitoring"
version = "0.1.0"
description = "Standalone Weave Signal monitor installation and conversation hydration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.10,<3",
    "weave==0.53.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
]

[project.scripts]
weave-signal-monitor = "weave_signal_monitoring.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_signal_monitoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/weave_signal_monitoring/catalog.py" = ["E501"]
